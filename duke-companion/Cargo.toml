[package]
name = "duke-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Duke Systems Contributors"]
license = "MIT"
repository = "https://github.com/duke-systems/duke-systems"
description = "Headless SteamOS / Bazzite / Linux Tailscale companion daemon for Duke Launcher save syncing, Proton compatdata mapping, and BLAKE3 chunk streaming"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1"
zstd = "0.13"
walkdir = "2.5"
