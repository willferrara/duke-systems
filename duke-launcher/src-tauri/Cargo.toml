[package]
name = "duke-launcher"
version = "2.1.1"
description = "Duke Launcher - Turbo Download Manager, Malware Shield & Game Launcher"
authors = ["Duke Launcher Contributors"]
license = "MIT"
repository = "https://github.com/duke-systems/duke-systems"
edition = "2021"
rust-version = "1.92.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
duke-core = { version = "0.1.0", path = "../../duke-core", features = ["win32-trim", "eco-qos", "net-doh", "pipe-ipc", "tray-daemon", "hid-raw", "shm-bus", "nvme-prefetch", "platform-backend"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
walkdir = "2.5"
urlencoding = "2.1"
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
memmap2 = "0.9"
fastcdc = "3.2"
zstd = "0.13"
flate2 = "1"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
wasmtime = { version = "44", default-features = false, features = ["runtime", "cranelift", "std", "wat"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
