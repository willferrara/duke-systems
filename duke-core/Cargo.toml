[package]
name = "duke-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/duke-systems/duke-systems"
description = "Shared ultra-optimized primitives for the Duke Systems desktop suite"

[features]
default = []
win32-trim = ["dep:windows"]
eco-qos = ["dep:windows"]
net-doh = ["dep:reqwest", "dep:serde_json", "dep:tokio", "dep:url", "dep:urlencoding"]
pipe-ipc = ["dep:serde", "dep:serde_json", "dep:tokio"]
tray-daemon = ["dep:tauri", "win32-trim"]
hid-raw = ["dep:hidapi", "dep:serde"]
macro-engine = [
    "dep:serde",
    "dep:windows",
    "windows?/Win32_UI_Input_KeyboardAndMouse",
    "windows?/Win32_UI_WindowsAndMessaging",
]
shm-bus = [
    "dep:windows",
    "windows?/Win32_Security",
    "windows?/Win32_System_Memory",
]
nvme-prefetch = [
    "dep:serde",
    "dep:windows",
    "windows?/Win32_Security",
    "windows?/Win32_Storage_FileSystem",
    "windows?/Win32_System_IO",
    "windows?/Win32_System_Memory",
    "windows?/Win32_System_SystemInformation",
]
platform-backend = ["dep:serde", "win32-trim"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.40", features = ["rt", "net", "io-util", "sync", "time", "macros"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
url = { version = "2.5", optional = true }
urlencoding = { version = "2.1", optional = true }
hidapi = { version = "2.6", optional = true }
tauri = { version = "2", features = ["tray-icon"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
