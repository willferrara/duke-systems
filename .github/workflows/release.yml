name: Release Windows x64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-duke-launcher:
    name: Build Duke Launcher (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            duke-core -> target
            duke-launcher/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: duke-launcher
        run: npm ci
      - name: Build Tauri Windows x64 release
        working-directory: duke-launcher
        run: npm run tauri build
      - name: Stage release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item "duke-launcher/src-tauri/target/release/duke-launcher.exe" "release-assets/Duke-Launcher-x64.exe" -Force
          $nsis = Get-ChildItem "duke-launcher/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) { Copy-Item $nsis.FullName "release-assets/Duke-Launcher-x64-setup.exe" -Force }
      - name: Upload assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME release-assets/* --clobber
          } else {
            gh release create $env:TAG_NAME release-assets/* --title "Duke Launcher $env:TAG_NAME" --generate-notes
          }
